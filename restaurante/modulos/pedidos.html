<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Restaurante</title>

    <link rel="stylesheet" href="../css/pedidos.css">
</head>

<body>

    <a href="../index.html" class="boton-volver">
        ⬅ Volver al Inicio
    </a>

    <section class="pedidos">

        <div class="contenedor">

            <h2>Haz tu Pedido</h2>
            <p>Completa la información para realizar tu pedido</p>

            <div class="formulario" >

                <div class="campo">
                    <label>Nombre de usuario</label>
                    <input id="nombre" type="text" placeholder="Ingresa tu nombre">
                </div>

                <div class="campo">
                    <label>Producto</label>
                    <input id="producto" type="text" placeholder="¿Qué deseas pedir?">
                </div>

                <div class="campo">
                    <label>Cantidad</label>
                    <input id="cantidad" type="number" placeholder="Cantidad">
                </div>

                <div class="campo">
                    <label>Dirección</label>
                    <input id="direccion" type="text" placeholder="Ingresa tu dirección">
                </div>

                <div class="campo">
                    <label>Teléfono</label>
                    <input id="telefono" type="tel" placeholder="Número de teléfono">
                </div>

                <div class="campo">
                    <label>Método de pago</label>

                    <select id="pago">
                        <option>Efectivo</option>
                        <option>Tarjeta</option>
                        <option>Nequi</option>
                        <option>Daviplata</option>
                    </select>
                </div>

                <div class="boton">
                    <button id="btnguardar" >Realizar Pedido</button>
                </div>

            </div>

        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/pedidos.js"></script>

</body>

</html>
