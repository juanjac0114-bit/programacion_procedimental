<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USUARIOS</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/usuarios.css">
</head>

<body>

<a href="../index.html" class="boton-volver">
    ⬅ Volver al Inicio
</a>

<div class="contenedor">

<form id="formulario">

    <div class="field">
        <label class="label">NOMBRE</label>
        <div class="control">
            <input id="nombre" class="input" type="text">
        </div>
    </div>

    <div class="field">
        <label class="label">APELLIDO</label>
        <div class="control">
            <input id="apellido" class="input" type="text">
        </div>
    </div>

    <div class="field">
        <label class="label">DOCUMENTO</label>
        <div class="control">
            <div class="select is-fullwidth">
                <select id="documento">
                    <option value="">SELECCIONE SU TIPO DE DOCUMENTO</option>
                    <option>T.I</option>
                    <option>C.C</option>
                    <option>C.E</option>
                </select>
            </div>
        </div>
    </div>

    <div class="field">
        <label class="label">NUMERO DE DOCUMENTO</label>
        <div class="control">
            <input id="numero_documento" class="input" type="text">
        </div>
    </div>

    <div class="field">
        <label class="label">TELEFONO</label>
        <div class="control">
            <input id="telefono" class="input" type="text">
        </div>
    </div>

    <div class="field">
        <label class="label">GENERO</label>

        <label class="radio">
            <input type="radio" name="genero" value="F">
            Femenino
        </label>

        <label class="radio">
            <input type="radio" name="genero" value="M">
            Masculino
        </label>

    </div>

    <div class="field">
        <label class="label">CARGO</label>
        <div class="control">
            <input id="cargo" class="input" type="text">
        </div>
    </div>

    <div class="field">
        <label class="label">FECHA DE NACIMIENTO</label>
        <div class="control">
            <input id="fecha_nacimiento" class="input" type="date">
        </div>
    </div>

    <div class="field">
        <label class="label">CORREO</label>
        <div class="control">
            <input id="correo" class="input" type="email">
        </div>
    </div>

    <div class="field">
        <label class="label">CONTRASEÑA</label>
        <div class="control">
            <input id="contraseña" class="input" type="password">
        </div>
    </div>

    <button type="button" id="btguard" class="button is-link">
        Registrar
    </button>

    <button type="reset" class="button is-light">
        Cancelar
    </button>

</form>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/usuarios.js"></script>

</body>
</html>
